        <h2>Five HTML Tags I Learned</h2>

        <dl>
            <dt>&lt;h1&gt;</dt>
            <dd>Defines the main heading of a webpage.</dd>

            <dt>&lt;p&gt;</dt>
            <dd>Defines a paragraph of text.</dd>

            <dt>&lt;img&gt;</dt>
            <dd>Displays an image on a webpage.</dd>

            <dt>&lt;a&gt;</dt>
            <dd>Creates a hyperlink to another page.</dd>

            <dt>&lt;ul&gt;</dt>
            <dd>Creates an unordered list.</dd>
